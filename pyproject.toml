[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "securityscanner"
version = "0.2.0"
description = "Scoped local security auditing — João Pereira Labs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "João Pereira"}]
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "pydantic>=2.8,<3", "defusedxml>=0.7.1,<1", "jinja2>=3.1.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-defusedxml>=0.7", "build>=1.2,<2"]

[project.scripts]
securityscanner = "securityscanner.cli:app"

[project.urls]
Repository = "https://github.com/joaopereiralabs/security-scanner"

[tool.hatch.build.targets.wheel]
packages = ["src/securityscanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real local Nmap scan (opt in with SECURITYSCANNER_NMAP_TEST=1)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/securityscanner"]
